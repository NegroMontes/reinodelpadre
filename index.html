<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campamento Nacional Reino del Padre 2027</title>
<!-- Aplica el tema elegido (si hay uno guardado) ANTES de que se pinte la
     primera pantalla -- sin esto, alguien que ya eligió modo oscuro vería
     un flash del tema claro hasta que el modulo de JS (que carga diferido)
     llegue a correr y recién ahí lo corrija. La clave 'fordoc_theme' tiene
     que coincidir con THEME_KEY de js/utils/storage.js (duplicado a
     propósito -- este script corre antes que cualquier modulo ES). -->
<script>
(function(){
  try{
    var t = localStorage.getItem('fordoc_theme');
    if(t === 'dark' || t === 'light'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>
<link rel="icon" type="image/png" href="assets/favicon.png">
<!-- Ícono al anclar a la pantalla de inicio (pedido del usuario, 15/10/2026:
     "¿Reino del Padre tiene ícono al anclar a inicio?") — sin esto, iOS/
     Android arman un ícono genérico (una captura recortada de la página, o
     un bloque de color con la inicial) en vez de usar el logo real. El
     favicon de arriba (180x217, recortado al escudo, con fondo transparente)
     no sirve para esto: Apple exige un PNG cuadrado y opaco (rellena de
     negro cualquier transparencia) — `apple-touch-icon.png` es una versión
     aparte, 180x180, con el mismo celeste de fondo del manual de marca y el
     escudo centrado con margen (ver el script que lo generó, no versionado,
     en el scratchpad de esta sesión). -->
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Reino del Padre">
<!-- Modo standalone al abrir desde el ícono anclado (pedido del usuario,
     15/10/2026: "se abre en el navegador, ¿se puede abrir independiente?") —
     sin esto, el ícono de la pantalla de inicio solo es un acceso directo
     que sigue abriendo Safari/Chrome con toda su barra de navegación. Estas
     3 líneas + manifest.json hacen que abra en su propia ventana, sin esa
     barra, como una app instalada (lo que en iOS/Android se llama PWA). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#162937">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views/gate.css">
<link rel="stylesheet" href="css/views/home.css">
<link rel="stylesheet" href="css/views/secuencial.css">
<link rel="stylesheet" href="css/views/users.css">
<link rel="stylesheet" href="css/views/feedback.css">
<link rel="stylesheet" href="css/views/cancionero.css">
</head>
<body>
<div class="app">

  <header class="top">
    <p class="kicker">Campamento Nacional AMJM</p>
    <div class="header-top-row">
      <div class="header-top-left">
        <img class="logo-mark" id="logoHomeBtn" src="assets/logo-icon.png" alt="Escudo Reino del Padre MDZ 2027" title="Volver a Inicio">
        <h1 class="header-title">Reino del Padre</h1>
        <span class="badge">MDZ 2027</span>
        <div id="headerBellSlot"></div>
      </div>
      <div class="header-top-right">
        <span id="themeToggleHome"><button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Cambiar tema claro/oscuro"></button></span>
        <div id="authBar"></div>
      </div>
    </div>
  </header>

  <div id="gate"></div>
  <div class="layout">
    <aside class="sidebar"><div class="day-rail" id="dayRail"></div></aside>
    <main class="main"><div class="panel" id="panel"></div></main>
  </div>
  <div id="feedbackWidget"></div>
  <!-- Música de fondo de una entrada secuencial (22/09/2026) — vive AFUERA de
       #panel a propósito: #panel se reescribe entero en cada renderPanel()
       (ej. al tocar "Siguiente"), y si el <audio> estuviera adentro se
       recrearía cada vez, reiniciando la música desde cero en cada paso. Acá
       sobrevive a esos re-renders; el JS solo le cambia el `src`/play/pause. -->
  <audio id="secuencialBgAudio"></audio>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
